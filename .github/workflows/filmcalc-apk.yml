name: Build FilmCalc SmartTec APK



on:

  workflow_dispatch:
  


jobs:

  apk:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Checkout
      
        uses: actions/checkout@v4
        
      - name: Setup pnpm
      
        uses: pnpm/action-setup@v4
        
        with:
        
          version: 9
          
      - name: Setup Node
      
        uses: actions/setup-node@v4
        
        with:
        
          node-version: 22
          
          cache: pnpm
          
      - name: Setup Java
      
        uses: actions/setup-java@v4
        
        with:
        
          distribution: temurin
          
          java-version: 17
          
      - name: Extract FilmCalc source
      
        run: |
        
          rm -rf filmcalc-source
          
          mkdir filmcalc-source
          
          unzip -q FilmCalc_SmartTec_v2.1.0_source.zip -d filmcalc-source
          
      - name: Install dependencies
      
        working-directory: filmcalc-source
        
        run: pnpm install --frozen-lockfile
        
      - name: Typecheck
      
        working-directory: filmcalc-source
        
        run: pnpm check
        
      - name: Engine QA
      
        working-directory: filmcalc-source
        
        run: pnpm test:engine
        
      - name: Prebuild Android
      
        working-directory: filmcalc-source
        
        run: pnpm exec expo prebuild --platform android --no-install
        
      - name: Assemble release APK
      
        working-directory: filmcalc-source/android
        
        run: ./gradlew assembleRelease --no-daemon
        
      - name: Upload APK
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: FilmCalc-SmartTec-v2.1.0-apk
          
          path: filmcalc-source/android/app/build/outputs/apk/release/*.apk
          
          if-no-files-found: error
          














































